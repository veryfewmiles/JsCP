<!DOCTYPE html>
<html>
<head>
    <title>
        ToDoList
    </title>
<style>
    body {
        font-family:cursive;
        background-color: aqua;
        padding:40px;
    }

    h3{
        color:#333;
    }

    #myForm{
        margin-bottom:30px;
    }

    #myInput{
        padding:10px;
        width: 250px;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    #myForm button{
        padding: 10px 15px;
        background-color: #4CAF50;
        color:white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    #myItem {
        padding:0px;
        width:400px;
    }

    #myItem li {
        background-color: white;
        padding:12px;
        margin-bottom:10px;
        border-radius: 5px;
        display:flex;
        justify-content: space-between;
    }

    #myItem li button {
        background-color: #f44336;
        color: white;
        border:none;
        padding: 6px 10px;
        border-radius: 4px;
        cursor: pointer;
    }
</style>
</head>
<body>
<h3>Add your To do list here</h3>
    <form id="myForm">
        <input id="myInput" type="text">
        <button> Add </button>
    </form>

    <h3>To do List</h3>
    <ul id="myItem"></ul>

<script>
var myForm = document.getElementById("myForm");
var myInput = document.getElementById("myInput");
var myItem = document.getElementById("myItem");

myForm.addEventListener("submit",
function(event){
    event.preventDefault()
    createItem(myInput.value)
})

function createItem(inputItems){
    var items = `<li>${inputItems}
    <button onclick="deleteElement(this)">Delete</button> </li>`
    myItem.insertAdjacentHTML("beforeend", items)
    myInput.value = ""
    myInput.focus()
}

function deleteElement(ElementToDelete){
    ElementToDelete.parentElement.remove()
}

</script>
</body>
</html>
