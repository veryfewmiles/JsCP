<!DOCTYPE html>
<html>
    <head>
        <title>StopWatch</title>
    </head>
<body>
    <div class ="wrapper">
        <h1>StopWatch</h1>
        <p><span id ="seconds">00</span>:<span id ="millieseconds">00</span></p>
        <button id = "button-Start">Start</button>
        <button id="button-Stop">Stop</button>
        <button id="button-Reset">Reset</button>
    </div>
    <script>
      window.onload = function () {
        var seconds = 00;
        var millieseconds = 00;
        var appendmillieseconds = document.getElementById("millieseconds");
        var appendseconds = document.getElementById("seconds");
        var buttonStart = document.getElementById("button-Start");
        var buttonStop = document.getElementById("button-Stop");
        var buttonReset = document.getElementById("button-Reset");
        var Interval ;

        buttonStart.onclick = function() {
            clearInterval(Interval);
            Interval = setInterval(startTimer, 10);
        }

        buttonStop.onclick = function() {
            clearInterval(Interval);
        }

        buttonReset.onclick = function() {
            clearInterval(Interval);
            millieseconds = "00";
            seconds = "00";
            appendmillieseconds.innerHTML = millieseconds;
            appendseconds.innerHTML = seconds;
        }

        function startTimer() {
            millieseconds++;

            if(millieseconds <=9){
                appendmillieseconds.innerHTML = "0" + millieseconds;
            }

            if (millieseconds >9){
                appendmillieseconds.innerHTML = millieseconds;
            }

            if (millieseconds > 99) {
                seconds++;
                appendseconds.innerHTML = "0" + seconds;
                millieseconds = 0;
                appendmillieseconds.innerHTML = "0" + 0;
            }
            if (seconds > 9) {
                appendseconds.innerHTML = seconds;
            }
        }
        }  
    </script>
</body>
</html>
