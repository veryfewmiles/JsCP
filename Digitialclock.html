<!DOCTYPE html>
<html>
<head>
    <title>
        Digital Clock
    </title>
    <style>

    body {
        margin: 0;
        padding: 0;
        background:linear-gradient(135deg, #1e3c72, #2a5298);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
    }

    #MyClockDisplay {
        color: #ffffff;
        font-size: 60px;
        font-weight:bold;
        letter-spacing: 3px;
        padding:20px 40px;
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.3);
        box-shadow: 0 0 20px rgba(0,0,0,0.5);
        text-align: center;
    }


    </style>
</head>
<body>
<div id="MyClockDisplay" onload="showtime()"></div>
<script>
function showtime() {
    var date = new Date();
    var h = date.getHours();
    var m = date.getMinutes();
    var s = date.getSeconds();
    var session ="AM";

    if (h == 0){
        h = 12;
    }

    if (h > 12){
        h = h - 12;
        session = "PM";
    }

    h = (h < 10) ? "0" + h : h;
    m = (m < 10) ? "0" + m : m;
    s = (s < 10) ? "0" + s : s;

var time = h + ":" + m + ":" + s + " " + session;
document.getElementById("MyClockDisplay").innerText = time;
setTimeout(showtime ,1000);

}

showtime();

</script>
</body>
